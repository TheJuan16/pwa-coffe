<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <title>My PWA - Café & Pokémon</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">

    <!-- Íconos para dispositivos Apple -->
    <link rel="apple-touch-icon" href="img/icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="72x72" href="img/icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="96x96" href="img/icons/icon-96x96.png">
    <link rel="apple-touch-icon" sizes="128x128" href="img/icons/icon-128x128.png">
    <link rel="apple-touch-icon" sizes="144x144" href="img/icons/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="img/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="img/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="384x384" href="img/icons/icon-384x384.png">
    <link rel="apple-touch-icon" sizes="512x512" href="img/icons/icon-512x512.png">
</head>
<body>
    <main>
        <nav class="navbar">
            <div class="nav-left">
                <h1>My PWA</h1>
                <ul>
                    <li id="nav-home" style="cursor: pointer;">Home</li>
                    <li id="tab-cafe" class="active-tab" style="cursor: pointer;">☕ Café</li>
                    <li id="tab-pokemon" style="cursor: pointer;">⚡ Pokémon</li>
                    <li>About</li>
                </ul>
            </div>

            <!-- Contenedor en la esquina derecha superior para el botón o el mensaje de instalada -->
            <div class="nav-right">
                <button id="btn-instalar" class="btn-install hidden">
                    📥 Descargar App
                </button>
                <div id="installed-msg" class="installed-badge hidden">
                    ✅ Aplicación ya instalada
                </div>
            </div>
        </nav>

        <!-- SECCIÓN DE CAFÉ -->
        <section id="section-cafe">
            <div class="container" id="cards-container"></div>
            <div class="container" id="detalle-container" style="display: none;"></div>
        </section>

        <!-- SECCIÓN DE POKÉMON -->
        <section id="section-pokemon" style="display: none;">
            <div class="container" id="pokemon-container"></div>
            <div style="margin: 2rem 0; text-align: center;">
                <button id="btn-cargar-mas" class="btn-ver-mas" style="max-width: 250px; display: inline-block;">Cargar más Pokémon</button>
            </div>
        </section>

        <!-- Ventana Modal de información para Pokémon -->
        <div id="pokemon-modal" class="modal hidden">
            <div class="modal-content">
                <span id="close-modal" class="close-btn">&times;</span>
                <div id="modal-details"></div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
